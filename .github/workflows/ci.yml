name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datam
          POSTGRES_PASSWORD: datam
          POSTGRES_DB: datam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://datam:datam@localhost:5432/datam_test
      TEST_DATABASE_URL: postgresql+asyncpg://datam:datam@localhost:5432/datam_test
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uv run python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
